
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ÉLANÉ | Gallery</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

    <style>

        body {
            margin: 0;
            background: #f7f3ef;
            color: #51473f;
            font-family: 'Montserrat', sans-serif;
        }

        h1, h2, h3 {
            font-family: 'Cormorant Garamond', serif;
        }

        .navbar {
            background: #ffffff;
            border-bottom: 1px solid #ddd3ca;
            padding: 15px 0;
        }

        .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            font-weight: 700;
            color: #5b4d44;
            letter-spacing: 2px;
        }

        .nav-link {
            color: #5b4d44 !important;
            font-size: 12px;
            font-weight: 500;
            margin-left: 18px;
            letter-spacing: 1px;
        }

        .nav-link:hover {
            color: #9a8170 !important;
        }

        .section {
            padding: 60px 0;
        }

        .gallery-box {
            background: white;
            border: 1px solid #ddd3ca;
            padding: 20px;
            text-align: center;
            height: 100%;
        }

        .gallery-box img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: #eee6df;
        }

        .gallery-box h2 {
            font-size: 24px;
            margin-top: 15px;
            margin-bottom: 0;
        }

        footer {
            background: #5b4d44;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 12px;
            letter-spacing: 1px;
        }

        @media (max-width: 991px) {
            .nav-link {
                margin-left: 0;
                padding: 10px 0;
            }
        }

        @media (max-width: 767px) {
            .logo {
                font-size: 28px;
            }

            .section {
                padding: 45px 15px;
            }
        }

    </style>

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg">

        <div class="container">

            <a class="navbar-brand logo" href="admin.html">ÉLANÉ</a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu">
                ☰
            </button>

            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="admin.html">DASHBOARD</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="adminapp.html">APPOINTMENTS</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="adminserv.html">SERVICES</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="admingal.html">GALLERY</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="adminuser.html">USERS</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="adminlogin.html">LOGIN</a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- Gallery Section -->

    <section class="section">

        <div class="container">

            <h1 class="text-center mb-5">
                Manage Gallery
            </h1>

            <div class="row g-4">

                <!-- Salon Interior -->

                <div class="col-12 col-md-4">

                    <div class="gallery-box">

                        <img
                            src="https://images.unsplash.com/photo-1521590832167-7bcbfaa6381f?w=600"
                            alt="Luxury Salon Interior">

                        <h2>Luxury Salon Interior</h2>

                    </div>

                </div>


                <!-- Hair Styling -->

                <div class="col-12 col-md-4">

                    <div class="gallery-box">

                        <img
                            src="https://images.unsplash.com/photo-1560066984-138dadb4c035?w=600"
                            alt="Beauty and Hair Styling">

                        <h2>Beauty & Hair Styling</h2>

                    </div>

                </div>


                <!-- Makeup Collection -->

                <div class="col-12 col-md-4">

                    <div class="gallery-box">

                        <img
                            src="https://images.unsplash.com/photo-1487412947147-5cebf100ffc2?w=600"
                            alt="Makeup Collection">

                        <h2>Makeup Collection</h2>

                    </div>

                </div>

            </div>

        </div>

    </section>


    <!-- Footer -->

    <footer>
        ÉLANÉ | Admin Panel
    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
