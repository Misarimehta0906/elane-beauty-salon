<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ÉLANÉ | Gallery</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

    <style>

        body {
            margin: 0;
            background: #f7f3ef;
            color: #51473f;
            font-family: 'Montserrat', sans-serif;
        }

        h1, h2, h3 {
            font-family: 'Cormorant Garamond', serif;
        }

        .navbar {
            background: #ffffff;
            border-bottom: 1px solid #ddd3ca;
            padding: 15px 0;
        }

        .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            font-weight: 700;
            color: #5b4d44;
            letter-spacing: 2px;
        }

        .nav-link {
            color: #5b4d44 !important;
            font-size: 12px;
            font-weight: 500;
            margin-left: 18px;
            letter-spacing: 1px;
        }

        .nav-link:hover {
            color: #9a8170 !important;
        }

        .section {
            padding: 60px 0;
        }

        .content {
            background: white;
            border: 1px solid #ddd3ca;
            padding: 30px;
        }

        .gallery-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        footer {
            background: #5b4d44;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 12px;
            letter-spacing: 1px;
        }

        @media (max-width: 991px) {

            .nav-link {
                margin-left: 0;
                padding: 10px 0;
            }

        }

        @media (max-width: 767px) {

            .logo {
                font-size: 28px;
            }

            .section {
                padding: 45px 15px;
            }

            .gallery-img {
                height: 260px;
            }

        }

        @media (max-width: 480px) {

            .logo {
                font-size: 25px;
            }

            .gallery-img {
                height: 230px;
            }

        }

    </style>

</head>
