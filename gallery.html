<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ÉLANÉ | Gallery</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">


    <style>

        body {
            margin: 0;
            background: #f7f3ef;
            color: #51473f;
            font-family: 'Montserrat', sans-serif;
        }

        h1,
        h2,
        h3,
        .logo {
            font-family: 'Cormorant Garamond', serif;
        }


        /* NAVBAR */

        .navbar {
            background: white;
            border-bottom: 1px solid #ddd3ca;
            padding: 15px 0;
        }

        .logo {
            font-size: 32px;
            font-weight: 700;
            color: #5b4d44;
            letter-spacing: 2px;
        }

        .nav-link {
            color: #5b4d44 !important;
            font-size: 12px;
            margin-left: 18px;
            letter-spacing: 1px;
        }


        /* BANNER */

        .banner {
            min-height: 380px;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 40px 20px;

            background-image:
                linear-gradient(
                    rgba(230,221,213,0.70),
                    rgba(230,221,213,0.70)
                ),
                url("https://images.unsplash.com/photo-1516975080664-ed2fc6a32937?auto=format&fit=crop&w=1600&q=80");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .banner h1 {
            font-size: 55px;
        }


        /* SECTION */

        .section {
            padding: 60px 0;
        }


        /* GALLERY */

        .gallery-img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            display: block;
        }


        /* FOOTER */

        footer {
            background: #5b4d44;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 12px;
        }


        /* TABLET */

        @media (max-width: 991px) {

            .nav-link {
                margin-left: 0;
                padding: 10px 0;
            }

            .banner {
                min-height: 320px;
            }

            .banner h1 {
                font-size: 48px;
            }

            .gallery-img {
                height: 250px;
            }

        }


        /* MOBILE */

        @media (max-width: 767px) {

            .logo {
                font-size: 28px;
            }

            .banner {
                min-height: 280px;
                padding: 30px 15px;
            }

            .banner h1 {
                font-size: 40px;
            }

            .section {
                padding: 45px 15px;
            }

            .gallery-img {
                height: 260px;
            }

        }


        /* SMALL MOBILE */

        @media (max-width: 480px) {

            .logo {
                font-size: 25px;
            }

            .banner h1 {
                font-size: 34px;
            }

            .gallery-img {
                height: 230px;
            }

        }

    </style>

</head>


<body>


<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg">

    <div class="container">

        <a class="navbar-brand logo" href="index.html">

        </a>

        </button>


        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">HOME</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="about.html">ABOUT</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="services.html">SERVICES</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="gallery.html">GALLERY</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="contact.html">CONTACT</a>
                </li>

                <li class="nav-item">
    <a class="nav-link" href="login.html">
        LOGIN
    </a>
</li>
            </ul>

        </div>

    </div>

</nav>


<!-- BANNER -->

<section class="banner">

    <h1>
        Our Gallery
    </h1>

    <p>
        A GLIMPSE OF ÉLANÉ
    </p>

</section>


<!-- GALLERY -->

<section class="section">

    <div class="container">

        <div class="row g-4">


            <div class="col-12 col-md-6 col-lg-4">

                <img
                    src="https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&w=700&q=80"
                    class="gallery-img"
                    alt="Salon">

            </div>


            <div class="col-12 col-md-6 col-lg-4">

                <img
                    src="https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&w=700&q=80"
                    class="gallery-img"
                    alt="Beauty">

            </div>


            <div class="col-12 col-md-6 col-lg-4">

                <img
                    src="https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?auto=format&fit=crop&w=700&q=80"
                    class="gallery-img"
                    alt="Makeup">

            </div>


            <div class="col-12 col-md-6 col-lg-4">

                <img

            </div>


            <div class="col-12 col-md-6 col-lg-4">

                <img

                    class="gallery-img"
                    alt="Salon Interior">

            </div>


            <div class="col-12 col-md-6 col-lg-4">

                <img
                    src="https://images.unsplash.com/photo-1521590832167-7bcbfaa6381f?auto=format&fit=crop&w=700&q=80"
                    class="gallery-img"
                    alt="Beauty Salon">

            </div>


        </div>

    </div>

</section>


<footer>

    ÉLANÉ | Beauty • Style • Elegance

</footer>

</html>
