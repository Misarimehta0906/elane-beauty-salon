<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ÉLANÉ | Logout</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

    <style>

        body {
            margin: 0;
            background: #f7f3ef;
            color: #51473f;
            font-family: 'Montserrat', sans-serif;
        }

        h1,
        h2,
        .logo {
            font-family: 'Cormorant Garamond', serif;
        }

        /* NAVBAR */

        .navbar {
            background: white;
            border-bottom: 1px solid #ddd3ca;
            padding: 15px 0;
        }

        .logo {
            font-size: 32px;
            font-weight: 700;
            color: #5b4d44;
            letter-spacing: 2px;
        }

        .nav-link {
            color: #5b4d44 !important;
            font-size: 12px;
            font-weight: 500;
            margin-left: 18px;
            letter-spacing: 1px;
        }

        /* LOGOUT */

        .logout-section {
            min-height: 600px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 50px 15px;
        }

        .logout-box {
            background: white;
            border: 1px solid #ddd3ca;

            padding: 45px;

            text-align: center;

            width: 100%;
            max-width: 500px;
        }

        .logout-box h1 {
            font-size: 50px;
        }

        .btn-custom {
            display: inline-block;

            background: #75655a;
            color: white;

            border: none;
            border-radius: 0;

            padding: 11px 25px;

            text-decoration: none;

            margin: 5px;
        }

        .btn-custom:hover {
            background: #5b4d44;
            color: white;
        }

        /* MOBILE */

        @media (max-width: 991px) {

            .nav-link {
                margin-left: 0;
                padding: 10px 0;
            }

        }

        @media (max-width: 767px) {

            .logo {
                font-size: 28px;
            }

            .logout-box {
                padding: 35px 20px;
            }

            .logout-box h1 {
                font-size: 42px;
            }

        }

        @media (max-width: 480px) {

            .logo {
                font-size: 25px;
            }

        }

    </style>

</head>


<body>


<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg">

    <div class="container">

        <a class="navbar-brand logo" href="index.html">
            ÉLANÉ
        </a>


        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menu">

            ☰

        </button>


        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">
                        HOME
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="about.html">
                        ABOUT
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="services.html">
                        SERVICES
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="gallery.html">
                        GALLERY
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="contact.html">
                        CONTACT
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="login.html">
                        LOGIN
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- LOGOUT -->

<section class="logout-section">

    <div class="logout-box">

        <h1>
            You Have Been Logged Out
        </h1>

        <p>
            Thank you for visiting ÉLANÉ.
        </p>


        <a
            href="login.html"
            class="btn-custom">

            LOGIN AGAIN

        </a>


        <a
            href="index.html"
            class="btn-custom">

            HOME

        </a>

    </div>

</section>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
