<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ÉLANÉ | Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

    <style>

        body {
            margin: 0;
            background: #f7f3ef;
            color: #51473f;
            font-family: 'Montserrat', sans-serif;
        }

        h1, h2, h3 {
            font-family: 'Cormorant Garamond', serif;
        }

        .navbar {
            background: #ffffff;
            border-bottom: 1px solid #ddd3ca;
            padding: 15px 0;
        }

        .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            font-weight: 700;
            color: #5b4d44;
            letter-spacing: 2px;
        }

        .nav-link {
            color: #5b4d44 !important;
            font-size: 12px;
            font-weight: 500;
            margin-left: 18px;
            letter-spacing: 1px;
        }

        .nav-link:hover {
            color: #9a8170 !important;
        }

        .section {
            padding: 60px 0;
        }

        .box {
            background: white;
            border: 1px solid #ddd3ca;
            padding: 30px;
            text-align: center;
            height: 100%;
        }

        .box h2 {
            font-size: 40px;
            margin-bottom: 5px;
        }

        .box p {
            margin-bottom: 0;
            font-size: 12px;
        }

        .welcome {
            margin-top: 25px;
            width: 100%;
            padding: 20px 25px;
            height: auto;
            text-align: left;
        }

        .welcome h2 {
            font-size: 34px;
            margin: 0 0 8px 0;
        }

        .welcome p {
            font-size: 13px;
            margin: 0;
            color: #8a7a70;
            line-height: 1.7;
        }

        footer {
            background: #5b4d44;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 12px;
            letter-spacing: 1px;
        }

        @media (max-width: 991px) {
            .nav-link {
                margin-left: 0;
                padding: 10px 0;
            }
        }

        @media (max-width: 767px) {
            .logo {
                font-size: 28px;
            }

            .section {
                padding: 45px 15px;
            }
        }

        @media (max-width: 480px) {
            .logo {
                font-size: 25px;
            }
        }

    </style>

</head>

<body>

<nav class="navbar navbar-expand-lg">

    <div class="container">

        <a class="navbar-brand logo" href="admin.html">
            ÉLANÉ
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menu">

            ☰

        </button>

        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="admin.html">DASHBOARD</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="adminapp.html">APPOINTMENTS</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="adminserv.html">SERVICES</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="admingal.html">GALLERY</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="adminuser.html">USERS</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="adminlogin.html">LOGIN</a>
                </li>

            </ul>

        </div>

    </div>

</nav>

<section class="section">

    <div class="container">

        <h1 class="text-center mb-5">
            Admin Dashboard
        </h1>

        <div class="row g-4">

            <div class="col-12 col-md-4">
                <div class="box">
                    <h2>25</h2>
                    <p>Total Appointments</p>
                </div>
            </div>

            <div class="col-12 col-md-4">
                <div class="box">
                    <h2>12</h2>
                    <p>Total Services</p>
                </div>
            </div>

            <div class="col-12 col-md-4">
                <div class="box">
                    <h2>50</h2>
                    <p>Total Users</p>
                </div>
            </div>

        </div>

        <div class="box welcome">

            <h2>
                Welcome Admin
            </h2>

            <p>
                Manage ÉLANÉ appointments, services,
                gallery and users from this admin panel.
            </p>

        </div>

    </div>

</section>

<footer>
    ÉLANÉ | Admin Panel
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
