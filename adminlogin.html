<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ÉLANÉ | Admin Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

    <style>

        body {
            margin: 0;
            background: #f7f3ef;
            color: #51473f;
            font-family: 'Montserrat', sans-serif;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
        }

        /* ================= LOGIN SECTION ================= */

        .login-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            background: white;
            border: 1px solid #ddd3ca;
            width: 100%;
            max-width: 525px;
            padding: 55px 50px;
        }

        /* ================= HEADING ================= */

        h1 {
            color: #51473f;
            text-align: center;
            font-size: 48px;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            letter-spacing: 1px;
            color: #8a7a70;
            margin-bottom: 45px;
        }

        /* ================= LABEL ================= */

        label {
            display: block;
            font-size: 12px;
            letter-spacing: 1.5px;
            color: #5b4d44;
            margin-bottom: 9px;
        }

        /* ================= INPUT ================= */

        .form-control {
            height: 56px;
            border: 1px solid #ddd3ca;
            border-radius: 0;
            padding: 12px 15px;
            font-size: 14px;
            color: #51473f;
        }

        .form-control::placeholder {
            color: #8a7a70;
        }

        .form-control:focus {
            border-color: #9a8170;
            box-shadow: none;
        }

        /* ================= LOGIN BUTTON ================= */

        .login-btn {
            width: 100%;
            background: #5b4d44;
            color: white;
            border: none;
            border-radius: 0;
            height: 55px;
            padding: 13px;
            font-size: 12px;
            letter-spacing: 1px;
            margin-top: 12px;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #9a8170;
        }

        /* ================= LOGOUT BUTTON ================= */

        .logout-btn {
            width: 100%;
            background: white;
            color: #5b4d44;
            border: 1px solid #5b4d44;
            border-radius: 0;
            height: 55px;
            padding: 13px;
            font-size: 12px;
            letter-spacing: 1px;
            margin-top: 12px;
            cursor: pointer;
        }

        .logout-btn:hover {
            background: #5b4d44;
            color: white;
        }

        /* ================= ERROR ================= */

        .error {
            display: none;
            color: #a05b5b;
            text-align: center;
            font-size: 12px;
            margin-top: 15px;
        }

        /* ================= BACK ================= */

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #5b4d44;
            text-decoration: none;
            font-size: 11px;
            letter-spacing: 1px;
        }

        .back:hover {
            color: #9a8170;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 480px) {

            .login-box {
                padding: 40px 25px;
            }

            h1 {
                font-size: 40px;
            }

            .subtitle {
                margin-bottom: 35px;
            }

        }

    </style>

</head>


<body>


<!-- ================= LOGIN ================= -->

<section class="login-section">

    <div class="login-box">

        <h1>
            Welcome Back
        </h1>

        <div class="subtitle">
            Login to ÉLANÉ
        </div>


        <!-- USERNAME -->

        <div class="mb-4">

            <label>
                USERNAME
            </label>

            <input
                type="text"
                id="username"
                class="form-control"
                placeholder="Enter username">

        </div>


        <!-- PASSWORD -->

        <div class="mb-4">

            <label>
                PASSWORD
            </label>

            <input
                type="password"
                id="password"
                class="form-control"
                placeholder="Enter password">

        </div>


        <!-- LOGIN -->

        <button
            type="button"
            class="login-btn"
            onclick="adminLogin()">

            LOGIN

        </button>


        <!-- ERROR -->

        <div id="errorMessage" class="error">

            Invalid username or password

        </div>


        <!-- LOGOUT -->

        <button
            type="button"
            class="logout-btn"
            onclick="adminLogout()">

            LOGOUT

        </button>


        <!-- BACK -->

        <a href="admin.html" class="back">

            BACK TO ADMIN PANEL

        </a>

    </div>

</section>


<script>

    /* ================= LOGIN ================= */

    function adminLogin() {

        var username =
            document.getElementById("username").value.trim();

        var password =
            document.getElementById("password").value.trim();


        if (username === "admin" && password === "admin123") {

            sessionStorage.setItem(
                "adminLoggedIn",
                "true"
            );

            window.location.href = "admin.html";

        }

        else {

            document.getElementById(
                "errorMessage"
            ).style.display = "block";

        }

    }


    /* ================= LOGOUT ================= */

    function adminLogout() {

        sessionStorage.removeItem(
            "adminLoggedIn"
        );

        window.location.href =
            "adminlogin.html";

    }


    /* ================= ENTER KEY ================= */

    document.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                adminLogin();

            }

        }
    );

</script>


</body>

</html>
