<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ÉLANÉ | Appointments</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap"
        rel="stylesheet">


    <style>

        /* ==============================
           BASIC
        ============================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #f7f3ef;
            color: #51473f;
            font-family: 'Montserrat', sans-serif;
        }

        h1,
        h2,
        h3 {
            font-family: 'Cormorant Garamond', serif;
        }


        /* ==============================
           NAVBAR
        ============================== */

        .navbar {
            width: 100%;
            background: #ffffff;

            border-bottom: 1px solid #ddd3ca;

            padding: 15px 0;

            margin: 0;

            border-radius: 0;
        }

        .navbar .container {
            width: 100%;
            max-width: 1200px;
        }

        .logo {
            font-family: 'Cormorant Garamond', serif;

            font-size: 32px;
            font-weight: 700;

            color: #5b4d44;

            letter-spacing: 2px;

            text-decoration: none;
        }

        .logo:hover {
            color: #5b4d44;
        }

        .nav-link {
            color: #5b4d44 !important;

            font-size: 12px;
            font-weight: 500;

            margin-left: 18px;

            letter-spacing: 1px;

            padding: 8px 0 !important;

            transition: 0.3s;
        }

        .nav-link:hover {
            color: #9a8170 !important;
        }

        .navbar-toggler {
            border: 1px solid #ddd3ca;

            border-radius: 0;

            color: #5b4d44;

            padding: 5px 10px;
        }

        .navbar-toggler:focus {
            box-shadow: none;
        }


        /* ==============================
           MAIN SECTION
        ============================== */

        .appointments-section {
            width: 100%;

            min-height: calc(100vh - 73px);

            background: #f7f3ef;

            padding: 60px 20px 80px;
        }


        .content {
            width: 100%;

            max-width: 1050px;

            margin: 0 auto;
        }


        /* ==============================
           TITLE
        ============================== */

        .page-title {
            text-align: center;

            font-family: 'Cormorant Garamond', serif;

            font-size: 50px;

            font-weight: 600;

            color: #5b4d44;

            margin-bottom: 42px;
        }


        /* ==============================
           APPOINTMENT BOX
        ============================== */

        .appointment-box {
            width: 100%;

            min-height: 90px;

            background: #ffffff;

            border: 1px solid #ddd3ca;

            border-radius: 0;

            margin-bottom: 22px;

            padding: 20px 28px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            transition: 0.3s ease;
        }

        .appointment-box:hover {
            border-color: #cbbdb2;

            box-shadow:
                0 8px 20px rgba(81, 71, 63, 0.08);
        }


        /* ==============================
           APPOINTMENT NAME
        ============================== */

        .appointment-name {
            font-family: 'Cormorant Garamond', serif;

            font-size: 29px;

            font-weight: 600;

            color: #51473f;

            margin: 0;
        }


        /* ==============================
           EDIT BUTTON
        ============================== */

        .edit-btn {
            min-width: 110px;

            height: 42px;

            padding: 0 22px;

            background: #5b4d44;

            color: #ffffff;

            border: none;

            border-radius: 0;

            font-family: 'Montserrat', sans-serif;

            font-size: 11px;

            font-weight: 500;

            letter-spacing: 1px;

            cursor: pointer;

            transition: 0.3s ease;
        }

        .edit-btn:hover {
            background: #9a8170;
        }


        /* ==============================
           FOOTER
        ============================== */

        footer {
            width: 100%;

            background: #5b4d44;

            color: #ffffff;

            text-align: center;

            padding: 20px;

            font-size: 12px;

            letter-spacing: 1px;
        }


        /* ==============================
           TABLET
        ============================== */

        @media (max-width: 991px) {

            .navbar .container {
                padding-left: 25px;
                padding-right: 25px;
            }

            .nav-link {
                margin-left: 0;

                padding: 10px 0 !important;
            }

            .appointments-section {
                padding: 50px 25px 70px;
            }

            .page-title {
                font-size: 46px;
            }

        }


        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 576px) {

            .navbar {
                padding: 14px 0;
            }

            .navbar .container {
                padding-left: 18px;
                padding-right: 18px;
            }

            .logo {
                font-size: 29px;
            }

            .appointments-section {
                padding: 40px 15px 55px;
            }

            .page-title {
                font-size: 40px;

                margin-bottom: 30px;
            }

            .appointment-box {
                min-height: 75px;

                padding: 15px 18px;

                margin-bottom: 18px;
            }

            .appointment-name {
                font-size: 23px;
            }

            .edit-btn {
                min-width: 85px;

                height: 38px;

                padding: 0 15px;

                font-size: 10px;
            }

        }


        /* ==============================
           SMALL MOBILE
        ============================== */

        @media (max-width: 380px) {

            .appointment-name {
                font-size: 21px;
            }

            .edit-btn {
                min-width: 70px;

                padding: 0 10px;

                font-size: 9px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================
         NAVBAR
    ====================================== -->

    <nav class="navbar navbar-expand-lg">

        <div class="container">

            <!-- LOGO -->

            <a
                class="navbar-brand logo"
                href="admin.html">

                ÉLANÉ

            </a>


            <!-- MOBILE MENU BUTTON -->

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu"
                aria-controls="menu"
                aria-expanded="false"
                aria-label="Toggle navigation">

                ☰

            </button>


            <!-- NAVIGATION -->

            <div
                class="collapse navbar-collapse"
                id="menu">

                <ul class="navbar-nav ms-auto">


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="admin.html">

                            DASHBOARD

                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="adminapp.html">

                            APPOINTMENTS

                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="adminserv.html">

                            SERVICES

                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="admingal.html">

                            GALLERY

                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="adminuser.html">

                            USERS

                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="adminlogin.html">

                            LOGIN

                        </a>

                    </li>


                </ul>

            </div>

        </div>

    </nav>



    <!-- =====================================
         APPOINTMENTS SECTION
    ====================================== -->

    <section class="appointments-section">

        <div class="content">


            <!-- TITLE -->

            <h1 class="page-title">
                Appointments
            </h1>



            <!-- =================================
                 APPOINTMENT 1
            ================================== -->

            <div class="appointment-box">

                <p class="appointment-name">
                    Hair Styling
                </p>

                <button
                    class="edit-btn"
                    onclick="editAppointment('Hair Styling')">

                    EDIT

                </button>

            </div>



            <!-- =================================
                 APPOINTMENT 2
            ================================== -->

            <div class="appointment-box">

                <p class="appointment-name">
                    Facial
                </p>

                <button
                    class="edit-btn"
                    onclick="editAppointment('Facial')">

                    EDIT

                </button>

            </div>



            <!-- =================================
                 APPOINTMENT 3
            ================================== -->

            <div class="appointment-box">

                <p class="appointment-name">
                    Hair Spa
                </p>

                <button
                    class="edit-btn"
                    onclick="editAppointment('Hair Spa')">

                    EDIT

                </button>

            </div>



            <!-- =================================
                 APPOINTMENT 4
            ================================== -->

            <div class="appointment-box">

                <p class="appointment-name">
                    Makeup
                </p>

                <button
                    class="edit-btn"
                    onclick="editAppointment('Makeup')">

                    EDIT

                </button>

            </div>


        </div>

    </section>



    <!-- =====================================
         FOOTER
    ====================================== -->

    <footer>

        ÉLANÉ | Admin Panel

    </footer>



    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script>

        function editAppointment(service) {

            alert("Edit Appointment: " + service);

        }

    </script>


    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


</body>

</html>
