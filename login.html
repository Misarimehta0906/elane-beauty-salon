<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ÉLANÉ | Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

    <style>

        body {
            margin: 0;
            background: #f7f3ef;
            color: #51473f;
            font-family: 'Montserrat', sans-serif;
        }

        h1,
        h2,
        h3,
        .logo {
            font-family: 'Cormorant Garamond', serif;
        }


        /* NAVBAR */

        .navbar {
            background: white;
            border-bottom: 1px solid #ddd3ca;
            padding: 15px 0;
        }

        .logo {
            font-size: 32px;
            font-weight: 700;
            color: #5b4d44;
            letter-spacing: 2px;
        }

        .nav-link {
            color: #5b4d44 !important;
            font-size: 12px;
            font-weight: 500;
            margin-left: 18px;
            letter-spacing: 1px;
        }

        .nav-link:hover {
            color: #9a8170 !important;
        }


        /* LOGIN SECTION */

        .login-section {
            min-height: 600px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 50px 15px;
        }


        /* LOGIN BOX */

        .login-box {
            background: white;
            border: 1px solid #ddd3ca;

            padding: 40px;

            width: 100%;
            max-width: 430px;
        }

        .login-box h1 {
            font-size: 50px;
            text-align: center;
        }

        .login-box p {
            text-align: center;
        }


        /* FORM */

        .form-control {
            border-radius: 0;
            border: 1px solid #d8cec5;
            padding: 12px;
        }


        /* BUTTON */

        .btn-custom {
            background: #75655a;
            color: white;

            border: none;
            border-radius: 0;

            padding: 11px 25px;

            width: 100%;
        }

        .btn-custom:hover {
            background: #5b4d44;
            color: white;
        }


        /* BACK */

        .back {
            margin-top: 20px;
            text-align: center;
            font-size: 13px;
        }

        .back a {
            color: #75655a;
            text-decoration: none;
        }


        /* TABLET */

        @media (max-width: 991px) {

            .nav-link {
                margin-left: 0;
                padding: 10px 0;
            }

        }


        /* MOBILE */

        @media (max-width: 767px) {

            .logo {
                font-size: 28px;
            }

            .login-box {
                padding: 30px 20px;
            }

            .login-box h1 {
                font-size: 42px;
            }

        }


        /* SMALL MOBILE */

        @media (max-width: 480px) {

            .logo {
                font-size: 25px;
            }

        }

    </style>

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg">

    <div class="container">

        <a class="navbar-brand logo" href="index.html">
            ÉLANÉ
        </a>


        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menu">

            ☰

        </button>


        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">
                        HOME
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="about.html">
                        ABOUT
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="services.html">
                        SERVICES
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="gallery.html">
                        GALLERY
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="contact.html">
                        CONTACT
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="login.html">
                        LOGIN
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- ================= LOGIN ================= -->

<section class="login-section">

    <div class="login-box">

        <h1>
            Welcome Back
        </h1>

        <p>
            Login to ÉLANÉ
        </p>


        <form onsubmit="loginUser(event)">


            <div class="mb-3">

                <input
                    type="text"
                    id="username"
                    class="form-control"
                    placeholder="Username"
                    required>

            </div>


            <div class="mb-3">

                <input
                    type="password"
                    id="password"
                    class="form-control"
                    placeholder="Password"
                    required>

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="btn btn-custom">

                LOGIN

            </button>


            <!-- LOGOUT BUTTON -->

            <a
                href="logout.html"
                class="btn btn-custom mt-2">

                LOGOUT

            </a>


        </form>


        <div class="back">

            <a href="index.html">
                ← Back to Home
            </a>

        </div>

    </div>

</section>


<!-- ================= LOGIN SCRIPT ================= -->

<script>

function loginUser(event) {

    event.preventDefault();

    window.location.href = "index.html";

}

</script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
